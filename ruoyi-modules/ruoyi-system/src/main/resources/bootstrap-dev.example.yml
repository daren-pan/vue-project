# 本地开发 - 禁用 Nacos 配置中心，使用本地 application-dev.yml
# 用法：cp bootstrap-dev.example.yml bootstrap-dev.yml
# bootstrap-dev.yml 已在 .gitignore 中，不会被提交
#
# 为什么需要这个文件？
#   Nacos 配置中心存了各模块的共享配置（含 RDS 数据源），
#   本地连不上 RDS，所以需要禁用配置中心，全用本地 application-dev.yml。
#   K8s 环境不需要此文件，直接走 Nacos 配置中心。

spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        namespace: ''
        metadata:
          zone: local
