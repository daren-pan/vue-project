# Tomcat
server:
  port: 9201

# Spring
spring: 
  config:
    import: optional:file:./local-env.yml
  application:
    # 应用名称
    name: ruoyi-system
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_HOST:localhost}:8848
        username: nacos
        password: nacos
        namespace: ${NACOS_NAMESPACE:}
        weight: 100
      config:
        # 配置中心地址
        server-addr: ${NACOS_HOST:localhost}:8848
        username: nacos
        password: nacos
        namespace: ${NACOS_NAMESPACE:}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ruoyi.system.domain,com.ruoyi.system.api.domain,com.ruoyi.system.domain.workflow   # 你的实体类所在包
#logging:
  #level:
    # 将你的Mapper接口所在包的日志级别设为DEBUG
    #com.ruoyi.system.mapper: debug
    # MyBatis自身的日志实现（可选）
    #org.apache.ibatis: debug
