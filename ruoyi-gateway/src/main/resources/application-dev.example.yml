# 本地开发配置模板
# 用法：cp application-dev.example.yml application-dev.yml
# application-dev.yml 已在 .gitignore 中，不会被提交

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: <你的密码>
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        - id: ruoyi-auth
          uri: lb://ruoyi-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: ruoyi-system
          uri: lb://ruoyi-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
