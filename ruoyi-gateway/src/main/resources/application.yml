# Tomcat
server:
  port: 8080

# Spring
spring: 
  config:
    import:
      - optional:file:./local-env.yml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  application:
    # 应用名称
    name: ruoyi-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    loadbalancer:
      nacos:
        enabled: true
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_HOST:localhost}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_DISCOVERY_NAMESPACE:}
      config:
        # 配置中心地址
        server-addr: ${NACOS_HOST:localhost}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址（Docker Compose 通过环境变量 SENTINEL_DASHBOARD 覆盖）
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: ${NACOS_HOST:localhost}:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
