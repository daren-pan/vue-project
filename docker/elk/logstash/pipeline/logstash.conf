input {
  tcp {
    port => 4560
    codec => json
  }
}

filter {
  # 添加服务名标签（来自容器名或自定义字段）
  mutate {
    add_field => {
      "service_name" => "%{[service_name]}"
    }
  }

  # 如果日志中有 @timestamp 就不再覆盖
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    timezone => "Asia/Shanghai"
  }

  # 清理无用字段
  mutate {
    remove_field => ["@version", "host", "port"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch-elk:9200"]
    index => "ruoyi-logs-%{+YYYY.MM.dd}"
  }
}
