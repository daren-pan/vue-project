---
# Elasticsearch Service
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-elk
  namespace: ruoyi

spec:
  ports:
    - port: 9200
      targetPort: 9200
      name: http
    - port: 9300
      targetPort: 9300
      name: transport
  selector:
    app: elasticsearch-elk

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-elk
  namespace: ruoyi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-elk
  template:
    metadata:
      labels:
        app: elasticsearch-elk
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: elasticsearch
          image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/elasticsearch:7.17.21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: "single-node"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            limits:
              memory: "2Gi"
              cpu: "500m"
            requests:
              memory: "1Gi"
              cpu: "250m"
      volumes:
        - name: es-data
          emptyDir: {}

---
# ==================== Logstash ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: ruoyi
data:
  logstash.conf: |
    input {
      tcp {
        port => 4560
        codec => json
      }
    }

    filter {
      mutate {
        add_field => {
          "service_name" => "%{[service_name]}"
        }
      }

      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
        timezone => "Asia/Shanghai"
      }

      mutate {
        remove_field => ["@version", "host", "port"]
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch-elk:9200"]
        index => "ruoyi-logs-%{+YYYY.MM.dd}"
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-logstash
  namespace: ruoyi
spec:
  ports:
    - port: 4560
      targetPort: 4560
      name: tcp
    - port: 5044
      targetPort: 5044
      name: filebeat
  selector:
    app: logstash

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: ruoyi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: logstash
          image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/logstash:7.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4560
              name: tcp
            - containerPort: 5044
              name: filebeat
          volumeMounts:
            - name: logstash-pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: logstash-pipeline
          configMap:
            name: logstash-config

---
# ==================== Kibana ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: ruoyi
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.basePath: "/kibana"
    server.rewriteBasePath: true
    elasticsearch.hosts: ["http://elasticsearch-elk:9200"]
    monitoring.ui.container.elasticsearch.enabled: true
    i18n.locale: "zh-CN"

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: ruoyi
spec:
  ports:
    - port: 15601
      targetPort: 5601
  selector:
    app: kibana
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: ruoyi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: kibana
          image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/kibana:7.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5601
          volumeMounts:
            - name: kibana-config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: kibana-config
          configMap:
            name: kibana-config
