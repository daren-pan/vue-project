# Jenkins Service
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: ruoyi
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 50000
      targetPort: 50000
      name: agent
  selector:
    app: jenkins
---
# Jenkins PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data
  namespace: ruoyi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: alicloud-nas
  resources:
    requests:
      storage: 10Gi
---
# Build cache PVC (Maven .m2 + npm cache)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-cache
  namespace: ruoyi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: alicloud-nas
  resources:
    requests:
      storage: 5Gi
---
# dind Docker storage PVC (镜像持久化)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dind-storage
  namespace: ruoyi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: alicloud-nas
  resources:
    requests:
      storage: 20Gi
---
# Jenkins Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: ruoyi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      imagePullSecrets:
        - name: acr-auth
      containers:
        # Jenkins master
        - name: jenkins
          image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/jenkins:lts-jdk17
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50000
              name: agent
          env:
            - name: JAVA_OPTS
              value: "-Djenkins.install.runSetupWizard=false -Dhudson.security.csrf.DefaultCrumbIssuer.EXCLUDE_SESSION_ID=true -Duser.timezone=Asia/Shanghai"
            - name: JENKINS_OPTS
              value: "--prefix=/jenkins"
            - name: TZ
              value: "Asia/Shanghai"
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: workspace
              mountPath: /workspace
            - name: build-cache
              mountPath: /cache
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data
        - name: workspace
          emptyDir: {}
        - name: build-cache
          persistentVolumeClaim:
            claimName: build-cache
---
# RBAC: allow Jenkins to manage deployments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: ruoyi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: ruoyi
