{{- /*
Nginx 前端 — ConfigMap + Service + Deployment
原文件: docker/k8s/06-nginx.yaml
*/ -}}
---
# Nginx 配置 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes  1;
    events {
        worker_connections  1024;
    }
    http {
        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;

        server {
            listen       80 default_server;
            server_name  _;

            location / {
                root   /home/ruoyi/projects/ruoyi-ui;
                try_files $uri $uri/ /index.html;
                index  index.html index.htm;
            }

            location /prod-api/{
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://ruoyi-gateway:8080/;
            }

            if ($uri ~ "/actuator") {
                return 403;
            }

            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   html;
            }
        }
    }

---
# Nginx Service
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-nginx
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - port: {{ .Values.nginx.servicePort }}
      targetPort: 80
  selector:
    app: ruoyi-nginx
  type: ClusterIP

---
# Nginx Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-nginx
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app: ruoyi-nginx
  template:
    metadata:
      labels:
        app: ruoyi-nginx
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: nginx
          image: {{ .Values.image.registry }}/ruoyi-nginx:{{ .Values.image.nginxTag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
