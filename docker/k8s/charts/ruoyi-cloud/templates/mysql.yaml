{{- /*
MySQL — ConfigMap + PVC + Service + Deployment
原文件: docker/k8s/02-mysql.yaml
*/ -}}
---
# MySQL 配置 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: {{ .Values.namespace }}
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-time-zone=+8:00
    lower-case-table-names=1
    innodb-buffer-pool-size=80M
    max_connections=200

---
# MySQL 持久卷声明
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.storage }}

---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-mysql
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - port: {{ .Values.mysql.servicePort }}
      targetPort: 3306
  selector:
    app: ruoyi-mysql
  type: LoadBalancer

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-mysql
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-mysql
  template:
    metadata:
      labels:
        app: ruoyi-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.mysql.password | quote }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-config
          configMap:
            name: mysql-config
