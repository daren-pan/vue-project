{{- /*
Ingress 路由
原文件: docker/k8s/08-ingress.yaml
*/ -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ruoyi-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Nacos 控制台
          - path: /nacos
            pathType: Prefix
            backend:
              service:
                name: ruoyi-nacos
                port:
                  number: 8848
          # Jenkins
          - path: /jenkins
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
          # Kibana
          - path: /kibana
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601
          # 前端（/ 放最后）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ruoyi-nginx
                port:
                  number: 30080
