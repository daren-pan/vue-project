# ============================================================
# RuoYi-Cloud Helm Chart — 默认配置
# 环境差异用 values-dev.yaml / values-prod.yaml 覆盖
# ============================================================

namespace: ruoyi

# 镜像仓库
image:
  registry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal
  nginxTag: latest

# Nginx 前端
nginx:
  replicas: 1
  servicePort: 30080
  resources:
    limits:
      memory: "256Mi"
      cpu: "500m"
    requests:
      memory: "128Mi"
      cpu: "250m"

# 微服务
imageTag: "3.6.7"                     # 所有微服务统一镜像标签

microservices:
  gateway:
    deployName: ruoyi-gateway
    port: 8080
    replicas: 1
    javaOpts: "-Xms256m -Xmx768m"
    resources:
      limits:   { memory: "1536Mi", cpu: "1000m" }
      requests: { memory: "512Mi",  cpu: "250m" }
    env:
      NACOS_HOST: "ruoyi-nacos"
      REDIS_HOST: "ruoyi-redis"
      LOGSTASH_HOST: "ruoyi-logstash"

  auth:
    deployName: ruoyi-auth
    port: 9200
    replicas: 1
    javaOpts: "-Xms256m -Xmx512m"
    resources:
      limits:   { memory: "1Gi",   cpu: "500m" }
      requests: { memory: "512Mi", cpu: "250m" }
    env:
      NACOS_HOST: "ruoyi-nacos"
      REDIS_HOST: "ruoyi-redis"
      LOGSTASH_HOST: "ruoyi-logstash"

  system:
    deployName: ruoyi-system
    port: 9201
    replicas: 1
    javaOpts: "-Xms256m -Xmx512m"
    resources:
      limits:   { memory: "1536Mi", cpu: "500m" }
      requests: { memory: "768Mi",  cpu: "250m" }
    env:
      NACOS_HOST: "ruoyi-nacos"
      DB_HOST: "ruoyi-mysql"
      DB_PORT: "3308"
      REDIS_HOST: "ruoyi-redis"
      LOGSTASH_HOST: "ruoyi-logstash"

  gen:
    deployName: ruoyi-gen
    port: 9202
    replicas: 0
    javaOpts: ""
    resources:
      limits:   { memory: "768Mi", cpu: "500m" }
      requests: { memory: "512Mi", cpu: "250m" }
    env:
      NACOS_HOST: "ruoyi-nacos"
      DB_HOST: "ruoyi-mysql"
      DB_PORT: "3308"
      REDIS_HOST: "ruoyi-redis"
      LOGSTASH_HOST: "ruoyi-logstash"

  job:
    deployName: ruoyi-job
    port: 9203
    replicas: 0
    javaOpts: ""
    resources:
      limits:   { memory: "768Mi", cpu: "500m" }
      requests: { memory: "512Mi", cpu: "250m" }
    env:
      NACOS_HOST: "ruoyi-nacos"
      DB_HOST: "ruoyi-mysql"
      DB_PORT: "3308"
      REDIS_HOST: "ruoyi-redis"
      LOGSTASH_HOST: "ruoyi-logstash"

  file:
    deployName: ruoyi-file
    port: 9300
    replicas: 0
    javaOpts: ""
    resources:
      limits:   { memory: "768Mi", cpu: "500m" }
      requests: { memory: "512Mi", cpu: "250m" }
    env:
      NACOS_HOST: "ruoyi-nacos"
      DB_HOST: "ruoyi-mysql"
      REDIS_HOST: "ruoyi-redis"

# ============================================================
# Redis
# ============================================================
redis:
  image: redis:7.0
  storage: 1Gi

# ============================================================
# MySQL
# ============================================================
mysql:
  image: mysql:5.7
  database: ry-cloud
  password: password
  servicePort: 3308
  storage: 5Gi
  resources:
    limits:   { memory: "1Gi",   cpu: "1000m" }
    requests: { memory: "512Mi", cpu: "500m" }

# ============================================================
# Nacos
# ============================================================
nacos:
  image: nacos/nacos-server:v2.5.1
  replicas: 1
  authToken: EbejS4ILlIZicDHDQc6R2rcgRuanjOq8Olqyx1lwLMY=
  resources:
    limits:   { memory: "2Gi",   cpu: "1000m" }
    requests: { memory: "1Gi",   cpu: "500m" }

# ============================================================
# Ingress 路由
# ============================================================
ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
