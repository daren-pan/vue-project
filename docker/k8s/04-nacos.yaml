---
# Nacos 配置 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-config
  namespace: ruoyi
data:
  application.properties: |
    spring.datasource.platform=mysql
    db.num=1
    db.url.0=jdbc:mysql://ruoyi-mysql:3306/ry-config?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC
    db.user=root
    db.password=password

    nacos.naming.empty-service.auto-clean=true
    nacos.naming.empty-service.clean.initial-delay-ms=50000
    nacos.naming.empty-service.clean.period-time-ms=30000

    management.endpoints.web.exposure.include=*

    management.metrics.export.elastic.enabled=false
    management.metrics.export.influx.enabled=false

    server.tomcat.accesslog.enabled=true
    server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i

    nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

    nacos.core.auth.system.type=nacos
    nacos.core.auth.enabled=true
    nacos.core.auth.default.token.expire.seconds=18000
    nacos.core.auth.default.token.secret.key=EbejS4ILlIZicDHDQc6R2rcgRuanjOq8Olqyx1lwLMY=
    nacos.core.auth.plugin.nacos.token.secret.key=EbejS4ILlIZicDHDQc6R2rcgRuanjOq8Olqyx1lwLMY
    nacos.core.auth.caching.enabled=true
    nacos.core.auth.enable.userAgentAuthWhite=false
    nacos.core.auth.server.identity.key=admin
    nacos.core.auth.server.identity.value=security

    nacos.istio.mcp.server.enabled=false

---
# Nacos Service
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-nacos
  namespace: ruoyi
spec:
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: rpc
      port: 9848
      targetPort: 9848
    - name: rpc-v2
      port: 9849
      targetPort: 9849
  selector:
    app: ruoyi-nacos
  type: ClusterIP

---
# Nacos Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-nacos
  namespace: ruoyi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-nacos
  template:
    metadata:
      labels:
        app: ruoyi-nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.5.1
          ports:
            - containerPort: 8848
            - containerPort: 9848
            - containerPort: 9849
          env:
            - name: MODE
              value: "standalone"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              value: "EbejS4ILlIZicDHDQc6R2rcgRuanjOq8Olqyx1lwLMY="
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "admin"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "security"
          volumeMounts:
            - name: nacos-config
              mountPath: /home/nacos/conf/application.properties
              subPath: application.properties
            - name: nacos-logs
              mountPath: /home/nacos/logs
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: nacos-config
          configMap:
            name: nacos-config
        - name: nacos-logs
          emptyDir: {}
