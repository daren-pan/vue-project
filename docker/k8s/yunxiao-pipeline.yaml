# ============================================================
# RuoYi-Cloud 云效流水线（Flow YAML）
# 包含：源码检出 → Maven/npm编译 → 构建镜像推送ACR → K8s滚动部署
# ============================================================
sources:
  ruoyiRepo:
    type: codeup
    name: Codeup源码
    endpoint: https://codeup.aliyun.com/6a31f41b5a46a9699cb73592/daren-pan/RuoYi-Cloud.git
    branch: springboot3
    triggerEvents:
      - push
    certificate:
      type: serviceConnection
      serviceConnection: j9zxaboxgwmqirft

stages:
  compile:
    name: 编译
    jobs:
      compileAll:
        name: Maven+NPM编译
        runsOn:
          group: public/cn-beijing
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          setupJava:
            name: 安装Java环境
            step: SetupJava
            with:
              jdkVersion: "17"
          mavenAndCopy:
            name: Maven编译并复制JAR
            step: Command
            with:
              run: |
                mvn clean package -DskipTests \
                  -pl ruoyi-modules/ruoyi-system,ruoyi-modules/ruoyi-gen,ruoyi-modules/ruoyi-job,ruoyi-modules/ruoyi-file,ruoyi-gateway,ruoyi-auth \
                  -am

                mkdir -p docker/ruoyi/auth/jar
                cp ruoyi-auth/target/ruoyi-auth.jar docker/ruoyi/auth/jar/
                mkdir -p docker/ruoyi/gateway/jar
                cp ruoyi-gateway/target/ruoyi-gateway.jar docker/ruoyi/gateway/jar/
                mkdir -p docker/ruoyi/modules/system/jar
                cp ruoyi-modules/ruoyi-system/target/ruoyi-modules-system.jar docker/ruoyi/modules/system/jar/
                mkdir -p docker/ruoyi/modules/gen/jar
                cp ruoyi-modules/ruoyi-gen/target/ruoyi-modules-gen.jar docker/ruoyi/modules/gen/jar/
                mkdir -p docker/ruoyi/modules/job/jar
                cp ruoyi-modules/ruoyi-job/target/ruoyi-modules-job.jar docker/ruoyi/modules/job/jar/
                mkdir -p docker/ruoyi/modules/file/jar
                cp ruoyi-modules/ruoyi-file/target/ruoyi-modules-file.jar docker/ruoyi/modules/file/jar/

          setupNode:
            name: 安装Node环境
            step: SetupNode
            with:
              versionType: "predefined"
              nodeVersion: "20.5"
          npmBuild:
            name: 前端编译
            step: Command
            with:
              run: |
                cd ruoyi-ui
                npm install --prefer-offline --registry=https://registry.npmmirror.com
                npm run build:prod
                cd ..
                mkdir -p docker/nginx/html
                cp -r ruoyi-ui/dist docker/nginx/html/

          buildNginx:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-nginx
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-nginx
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-nginx
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/nginx/dockerfile
              dockerContext: docker/nginx

          buildAuth:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-auth
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-auth
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-auth
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/ruoyi/auth/dockerfile
              dockerContext: docker/ruoyi/auth

          buildGateway:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-gateway
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-gateway
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-gateway
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/ruoyi/gateway/dockerfile
              dockerContext: docker/ruoyi/gateway

          buildSystem:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-system
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-system
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-system
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/ruoyi/modules/system/dockerfile
              dockerContext: docker/ruoyi/modules/system

          buildGen:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-gen
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-gen
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-gen
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/ruoyi/modules/gen/dockerfile
              dockerContext: docker/ruoyi/modules/gen

          buildJob:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-job
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-job
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-job
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/ruoyi/modules/job/dockerfile
              dockerContext: docker/ruoyi/modules/job

          buildFile:
            step: DockerBuildPushACR
            name: 构建推送ruoyi-file
            with:
              serviceConnection: uson78n1xebwsgdy
              artifact: ruoyi-file
              region: cn-hangzhou
              dockerRegistry: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-file
              dockerTag: "3.6.7-${BUILD_NUMBER}"
              dockerfilePath: docker/ruoyi/modules/file/dockerfile
              dockerContext: docker/ruoyi/modules/file

  # ==================== K8s镜像升级部署 ====================
  deploy:
    name: K8s镜像升级
    jobs:
      kubectl_set_image_job:
        name: Kubernetes镜像升级
        runsOn:
          group: public/cn-hangzhou
          container: build-steps-public-registry.cn-hangzhou.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          setImageSystem:
            name: 升级ruoyi-system
            step: KubectlSetImage
            with:
              kubernetesCluster: "ADwy1j6Eux9Zea89"
              namespace: ruoyi
              workloadKind: deployment
              workload: ruoyi-system
              container: system
              artifact: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-system:3.6.7-${BUILD_NUMBER}

          setImageGateway:
            name: 升级ruoyi-gateway
            step: KubectlSetImage
            with:
              kubernetesCluster: "ADwy1j6Eux9Zea89"
              namespace: ruoyi
              workloadKind: deployment
              workload: ruoyi-gateway
              container: gateway
              artifact: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-gateway:3.6.7-${BUILD_NUMBER}

          setImageAuth:
            name: 升级ruoyi-auth
            step: KubectlSetImage
            with:
              kubernetesCluster: "ADwy1j6Eux9Zea89"
              namespace: ruoyi
              workloadKind: deployment
              workload: ruoyi-auth
              container: auth
              artifact: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-auth:3.6.7-${BUILD_NUMBER}

          setImageGen:
            name: 升级ruoyi-gen
            step: KubectlSetImage
            with:
              kubernetesCluster: "ADwy1j6Eux9Zea89"
              namespace: ruoyi
              workloadKind: deployment
              workload: ruoyi-gen
              container: gen
              artifact: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-gen:3.6.7-${BUILD_NUMBER}

          setImageJob:
            name: 升级ruoyi-job
            step: KubectlSetImage
            with:
              kubernetesCluster: "ADwy1j6Eux9Zea89"
              namespace: ruoyi
              workloadKind: deployment
              workload: ruoyi-job
              container: job
              artifact: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-job:3.6.7-${BUILD_NUMBER}

          setImageNginx:
            name: 升级ruoyi-nginx
            step: KubectlSetImage
            with:
              kubernetesCluster: "ADwy1j6Eux9Zea89"
              namespace: ruoyi
              workloadKind: deployment
              workload: ruoyi-nginx
              container: nginx
              artifact: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-nginx:3.6.7-${BUILD_NUMBER}
