---
# ==================== ruoyi-gateway ====================
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gateway
  namespace: ruoyi
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: ruoyi-gateway
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  namespace: ruoyi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-gateway
  template:
    metadata:
      labels:
        app: ruoyi-gateway
    spec:
      imagePullSecrets:
        - name: acr-auth
      initContainers:
        - name: wait-for-nacos
          image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-gateway:3.6.7
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://ruoyi-nacos:8848/nacos/; do
                echo "Waiting for Nacos..."
                sleep 3
              done
              echo "Nacos is ready!"
      containers:
        - name: gateway
          image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/ruoyi-gateway:3.6.7
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-profile
          ports:
            - containerPort: 8080
          env:
            - name: NACOS_HOST
              value: "ruoyi-nacos.ruoyi.svc.cluster.local"
            - name: REDIS_HOST
              value: "ruoyi-redis"
            - name: LOGSTASH_HOST
              value: "ruoyi-logstash"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx768m"
          resources:
            limits:
              memory: "1536Mi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "250m"
