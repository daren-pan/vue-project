version : '3.8'
services:
  ruoyi-nacos:
    container_name: ruoyi-nacos
    image: nacos/nacos-server:v2.5.1
    build:
      context: ./nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=EbejS4ILlIZicDHDQc6R2rcgRuanjOq8Olqyx1lwLMY=
      - NACOS_AUTH_IDENTITY_KEY=admin
      - NACOS_AUTH_IDENTITY_VALUE=security
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - ruoyi-mysql
  ruoyi-mysql:
    container_name: ruoyi-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=80M',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: password
  ruoyi-redis:
    container_name: ruoyi-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  ruoyi-nginx:
    container_name: ruoyi-nginx
    image: ruoyi-nginx:latest
    build:
      context: ./nginx
    ports:
      - "81:80"
    volumes:
      - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - ruoyi-gateway
    links:
      - ruoyi-gateway
  ruoyi-gateway:
    container_name: ruoyi-gateway
    image: docker-ruoyi-gateway:3.6.7
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - ruoyi-redis
    links:
      - ruoyi-redis
    environment:
      - NACOS_HOST=ruoyi-nacos
      - REDIS_HOST=ruoyi-redis
      - SENTINEL_DASHBOARD=ruoyi-sentinel:8858
  ruoyi-auth:
    container_name: ruoyi-auth
    image: docker-ruoyi-auth:3.6.7
    build:
      context: ./ruoyi/auth
      dockerfile: dockerfile
    ports:
      - "9200:9200"
    depends_on:
      - ruoyi-redis
    links:
      - ruoyi-redis
    environment:
      - NACOS_HOST=ruoyi-nacos
      - REDIS_HOST=ruoyi-redis
  ruoyi-modules-system:
    container_name: ruoyi-modules-system
    image: docker-ruoyi-modules-system:3.6.7
    build:
      context: ./ruoyi/modules/system
      dockerfile: dockerfile
    ports:
      - "9301:9301"
    depends_on:
      - ruoyi-redis
      - ruoyi-mysql
    links:
      - ruoyi-redis
      - ruoyi-mysql
    environment:
      - SERVER_PORT=9301                # 设置容器内服务监听端口
      - NACOS_HOST=ruoyi-nacos
      - DB_HOST=ruoyi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - REDIS_HOST=ruoyi-redis
      - SPRING_CLOUD_NACOS_CONFIG_USERNAME=nacos
      - SPRING_CLOUD_NACOS_CONFIG_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_USERNAME=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD=nacos
      - SPRING_CLOUD_NACOS_DISCOVERY_WEIGHT=1
      # 添加 SkyWalking Agent 配置
      #- JAVA_OPTS=-javaagent:/sw-agent/skywalking-agent.jar -Dskywalking.agent.service_name=ruoyi-modules-system
      #- SW_AGENT_COLLECTOR_BACKEND_SERVICES=oap:11800
    #volumes:
      # 挂载宿主机上的 skywalking-agent 目录到容器的 /sw-agent
      #- ./skywalking/skywalking-agent:/sw-agent
  ruoyi-modules-gen:
    container_name: ruoyi-modules-gen
    image: docker-ruoyi-modules-gen:3.6.7
    build:
      context: ./ruoyi/modules/gen
      dockerfile: dockerfile
    ports:
      - "9202:9202"
    depends_on:
      - ruoyi-mysql
    links:
      - ruoyi-mysql
    environment:
      - NACOS_HOST=ruoyi-nacos
      - DB_HOST=ruoyi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - REDIS_HOST=ruoyi-redis
  ruoyi-modules-job:
    container_name: ruoyi-modules-job
    image: docker-ruoyi-modules-job:3.6.7
    build:
      context: ./ruoyi/modules/job
      dockerfile: dockerfile
    ports:
      - "9203:9203"
    depends_on:
      - ruoyi-mysql
    links:
      - ruoyi-mysql
    environment:
      - NACOS_HOST=ruoyi-nacos
      - DB_HOST=ruoyi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - REDIS_HOST=ruoyi-redis
  ruoyi-modules-file:
    container_name: ruoyi-modules-file
    image: docker-ruoyi-modules-file:3.6.7
    build:
      context: ./ruoyi/modules/file
      dockerfile: dockerfile
    ports:
      - "9300:9300"
    volumes:
    - ./ruoyi/uploadPath:/home/ruoyi/uploadPath
    environment:
      - NACOS_HOST=ruoyi-nacos
      - DB_HOST=ruoyi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - REDIS_HOST=ruoyi-redis
  ruoyi-visual-monitor:
    container_name: ruoyi-visual-monitor
    image: docker-ruoyi-visual-monitor:3.6.7
    build:
      context: ./ruoyi/visual/monitor
      dockerfile: dockerfile
    ports:
      - "9100:9100"
    environment:
      - NACOS_HOST=ruoyi-nacos
      - DB_HOST=ruoyi-mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - REDIS_HOST=ruoyi-redis
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: ruoyi-skywalking-es
    restart: always
    ports:
      - "9300:9200"
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: ruoyi-skywalking-oap
    depends_on:
      - elasticsearch
    links:
      - elasticsearch
    restart: always
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200

  ui:
    image: apache/skywalking-ui:9.7.0
    container_name: ruoyi-skywalking-ui
    depends_on:
      - oap
    links:
      - oap
    restart: always
    ports:
      - "8090:8080"
    environment:
      - SW_OAP_ADDRESS=http://oap:12800

  # ========== Sentinel 流量治理 ==========
  ruoyi-sentinel:
    container_name: ruoyi-sentinel
    image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/sentinel-dashboard:1.8.6
    restart: always
    ports:
      - "8718:8858"

    # ========== ELK 日志系统 ==========
  elasticsearch-elk:
    image: elasticsearch:7.17.0
    container_name: ruoyi-elk-es
    restart: always
    ports:
      - "9400:9200"
      - "9401:9300"
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elk-es-data:/usr/share/elasticsearch/data

  logstash:
    image: logstash:7.17.0
    container_name: ruoyi-logstash
    restart: always
    ports:
      - "5044:5044"
      - "4560:4560"
    volumes:
      - ./elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch-elk

  kibana:
    image: kibana:7.17.0
    container_name: ruoyi-kibana
    restart: always
    ports:
      - "5601:5601"
    volumes:
      - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    depends_on:
      - elasticsearch-elk

  # ========== Docker-in-Docker（安全的 Docker 构建环境）==========
  dind:
    container_name: ruoyi-dind
    image: crpi-zu4tna9y8drenzc4.cn-hangzhou.personal.cr.aliyuncs.com/ruoyi-personal/docker:27-dind
    restart: always
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - dind-certs:/certs
      - dind-data:/var/lib/docker

  # ========== Jenkins CI/CD ==========
  jenkins:
    container_name: ruoyi-jenkins
    image: jenkins/jenkins:lts-jdk17
    restart: always
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      - DOCKER_HOST=tcp://dind:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
    volumes:
      - jenkins-data:/var/jenkins_home
      - dind-certs:/certs/client
      - ${HOME}/.kube/config:/root/.kube/config
      - /usr/local/bin/kubectl:/usr/local/bin/kubectl
      - /usr/bin/docker:/usr/bin/docker

volumes:
    redis-data:
    elk-es-data:
    jenkins-data:
    dind-certs:
    dind-data: